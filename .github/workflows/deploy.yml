name: Deploy

# This repository's default branch is claude/code-kit-handover-2zx92f, and a
# workflow's `on.push.branches` filter cannot read the default branch
# dynamically, so it is named here. Rename it in both places if the branch
# ever changes.
on:
  push:
    branches: [claude/code-kit-handover-2zx92f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page argues for mechanical checks in the pipeline, so the palette
      # check runs here: a colour pair that drops below its threshold fails
      # the deploy instead of shipping.
      - name: Check palette contrast
        run: python3 tools/contrast.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
