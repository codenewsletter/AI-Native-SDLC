name: Deploy to Netlify

# This repository's default branch is claude/code-kit-handover-2zx92f, and a
# workflow's on.push.branches filter cannot read the default branch
# dynamically, so it is named here. Rename it in both places if it changes.
on:
  push:
    branches: [claude/code-kit-handover-2zx92f]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script netlify.toml runs, so a Git-linked Netlify build and
      # this workflow publish byte-identical output. It also runs the palette
      # gate: a colour pair below its threshold stops the deploy.
      - name: Build the site
        run: bash tools/build-site.sh

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Skip rather than fail while the secrets are still unset, so adding
          # this workflow does not redden every push before it is configured.
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are not set — skipping the deploy."
            echo "Add both under Settings → Secrets and variables → Actions, then re-run."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy \
            --dir=_site \
            --prod \
            --message "${GITHUB_SHA::7} — ${GITHUB_REF_NAME}"
